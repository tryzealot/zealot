      title: インストールの問題と解決策
      body_html: |
        <ol class="list-decimal px-5">
          <li>
            iOS 9 以降で手動インストールした場合、開発元を手動で信頼する必要があります。
            手順: 「設定」->「一般」->「VPNとデバイス管理」-> 該当のプロファイルを選択 ->「信頼」。
          </li>
          <li>AdHoc アプリを手動インストールする場合は、App Store 版の同一アプリを事前にアンインストールしてください！</li>
        </ol>
    cert_expired_issues:
      title: iOS 署名証明書の問題
      body_html: |
        <ol class="list-decimal px-5">
          <li>
            iOS では、開発中やテスト中のアプリに対して Apple の署名検証メカニズムが機能します。
            署名証明書の有効期限は発行日から 1 年間です。期限切れ後は再署名を行わないとインストールできません。
          </li>
          <li>開発者に連絡し、Apple Developer サイトで証明書を再発行してアプリをリビルド・アップロードしてもらってください。</li>
          <li>証明書を再発行しても以前のビルドには反映されません（期限切れビルドは再署名するまで期限切れのままです）。</li>
        </ol>
