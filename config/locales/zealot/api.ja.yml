        description: アプリのチャンネルキーでデバッグファイルを一覧表示
      show:
        title: デバッグファイル取得
        description: デバッグファイルを取得
      download:
        title: デバッグファイルダウンロード
        description: |
          単一の iOS または Android デバッグファイルをダウンロードします。

          `channel_key` と `release_version` を必須条件とし、`build_version`
          パラメータを渡さない場合、`order` を使用してソート条件に一致する最初のデバッグファイルアドレスを取得できます。ソート方法:

          - `version`: 最新バージョン
          - `upload_date`: 最終アップロード日時
      upload:
        title: デバッグファイルアップロード
        description: |
          zip 形式でアーカイブされた dSYM または ProGuard ファイルをアップロードします:

          - `iOS`: zip 圧縮された dSYM ファイル
          - `Android`: mapping.txt、R.txt、または AndroidManifest.xml ファイルを含む zip 圧縮ファイル
      destroy:
        title: デバッグファイル削除
        description: デバッグファイル ID および全データ（dSYM または ProGuard ファイルを含む）を削除

