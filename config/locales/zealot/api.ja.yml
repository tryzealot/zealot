      destroyed:
        default: リソースは削除されました
    definitions:
      upload_options:
        description: アプリアップロード用フォームデータオプション
        properties:
          channel_key: チャンネルキー（空欄の場合は新規アプリを作成）
          file: アップロードするアプリバイナリファイル
          name: アプリ名（空欄の場合は解析されたメタデータのアプリ名を使用）
          password: アクセスパスワード（空欄の場合はパスワードを解除）
          release_type: "リリースタイプ（例: debug、beta、adhoc、release、enterprise など）"
          source: アップロード元（デフォルトは `api`）
          changelog: 変更履歴（プレーンテキストまたは JSON 形式データ）
          branch: バージョン管理システムのブランチ名
          git_commit: Git コミット SHA ハッシュ値
          ci_url: CI サービスのビルド URL
          custom_fields: JSON 形式のカスタムフィールド（アイコンは FontAwesome のみ対応）
      app_options:
        description: アプリフォームデータ
        properties:
          name: アプリ名
      scheme_options:
        description: アプリスキームフォームデータ
        properties:
          name: スキーム名
          new_build_callout: 新規ビルド利用可能時に通知バナーを表示するかどうか
          retained_builds: 保持するビルド数（`0` で制限無効）
      channel_options:
        description: アプリチャンネルフォームデータ
        properties:
          name: チャンネル名
          device_type: デバイスタイプ
          slug: チャンネルのスラッグ（未指定時はランダム生成）
          bundle_id: 識別子検証設定（`*` で検証スキップ。iOS は `bundle_id`、Android は `package_name`）
          git_url: Git リポジトリ URL
          password: パスワードアクセスの有効化
          download_filename_type: ダウンロードファイル名形式
      release_options:
        description: アプリビルドメタデータフォームデータ
        properties:
          build_version: ビルドバージョン
          release_version: リリースバージョン
          release_type: "リリースタイプ（例: debug、beta、adhoc、release、enterprise など）"
          source: アップロード元（デフォルトは `api`）
          changelog: 変更履歴（プレーンテキストまたは JSON 形式データ）
          branch: バージョン管理システムのブランチ名
          git_commit: Git コミット SHA ハッシュ値
          ci_url: CI サービスのビルド URL
          custom_fields: JSON 形式のカスタムフィールド（アイコンは FontAwesome のみ対応）
      collaborator_options:
        description: アプリコラボレーターフォームデータ
        properties:
          role: ロール名
      user_options:
        description: ユーザーフォームデータ
        properties:
          username: ユーザー名
          email: メールアドレス
          password: パスワード
          locale: 言語
          appearance: 外観
          timezone: タイムゾーン
          role: ユーザーロール
      debug_file_options:
        description: デバッグファイルフォームデータ
        properties:
          channel_key: チャンネルキー
          file: zip 形式の圧縮ファイル（dSYM または ProGuard）
          release_version: リリースバージョン（Android の ProGuard ファイルでは必須）
          build_version: ビルドバージョン（Android の ProGuard ファイルでは必須）

    apps:
