ja:
  api:
    info:
      description: |
        本ドキュメントには API をテストする機能は含まれていません。API の動作検証には以下のツールを推奨します:

        - [cURL](https://curl.se/) (推奨、コマンドライン)
        - [Bruno](https://www.usebruno.com/)
        - [Postman](https://www.postman.com/downloads/)
        - Web ブラウザ（ヘッダーやリクエスト本文の送信が不要な場合）

        クライアントの準備が整ったら、`GET {host}/api/version` へリクエストを送信して動作を確認できます:

        ```json
        {
          "version": "6.2.1",
          "vcs_ref": "effe99c25b79fd55d3e1959ea3af0bcb6b75ba1d",
          "build_date": "2024-05-23T06:04:48.989Z"
        }
        ```

        ## 認証

        本 API では「パーソナルアクセストークン」による認証のみをサポートしています。
        すべてのトークンは Zealot ユーザーに紐付けられており、リクエストの `token` クエリパラメータとして渡します。

        例:

        ```
        https://tryzealot.ews.im/api/users?token={token}
        ```

        ### パーソナルアクセストークン

        パーソナルアクセストークン（PAT）は[ユーザー設定](https://zealot.ews.im/docs/user-guide/user_settings)から取得できます。
    servers:
      description: デモサーバー
    security:
      token:
        description: ユーザートークン
    parameters:
      id: プライマリキー ID
      scheme_id: アプリスキーム ID
      app_id: アプリ ID
      user_id: ユーザー ID
      page: ページ番号
      per_page: 1 ページあたりの件数
      scope: スコープ
      channel_key: チャンネルキー
      bundle_id: iOS の場合は `bundle_id`、Android の場合は `package_name`
      git_commit: Git コミット SHA
      order: 並び順
      release_version: リリースバージョン
      build_version: ビルドバージョン
      supported_values: "%{values} で指定可能な値"
      email: メールアドレス
    schemas:
      app_index:
        description: 一覧形式で返されるアプリ
      app_versions:
        description: 一覧形式で返されるアプリ
      app:
        description: アプリオブジェクト
      scheme:
        description: アプリスキームオブジェクト
      channel:
        description: アプリチャンネルオブジェクト
      release:
        description: アプリのリリースビルドオブジェクト
      release_changelog:
        description: リリースビルドの変更履歴
      release_custom_field:
        description: リリースビルドのカスタムフィールド
      collaborator:
        description: コラボレーターオブジェクト
      debug_file:
        description: デバッグファイルオブジェクト
      debug_file_metadata:
        description: デバッグファイルのメタデータオブジェクト
      metadata_dsym:
        description: メタデータ dSYM オブジェクト
      metadata_proguard:
        description: メタデータ ProGuard オブジェクト
      metadata_proguard_file:
        description: ProGuard ファイルオブジェクト
      user:
        description: ユーザーオブジェクト
      version:
