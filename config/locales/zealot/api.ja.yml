          show: スキームを取得
          create: スキームを作成
          update: スキームを更新
          destroy: スキームを削除
      create:
        title: アプリスキーム作成
        description: アプリのスキームを作成
      show:
        title: スキーム取得
        description: アプリのスキームを取得
