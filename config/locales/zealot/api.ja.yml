        description: |
          指定されたクエリによりリリースが存在するか確認します。以下の 2 組の組み合わせに対応しています:

          - `bundle_id`、`release_version`、`build_verion`
          - `bundle_id`、`git_commit`
      latest:
        title: 最新ビルド取得
        description: アプリの単一チャンネルにおける最新バージョン一覧をアップロード日時の降順で照会
      create:
