      body_html: |
        <h4>デバッグファイルとは、および取得方法</h4>
        <h5>iOS</h5>
        <p>Xcode での取得:</p>
        <ul>
          <li>Xcode を開き、「Window」->「Organizer」を選択します</li>
          <li>プロジェクトを選択し、「Archives」内のアーカイブを確認します</li>
          <li>ビルドを選択 ->「Show in Finder」で .xcarchive フォルダを開きます</li>
          <li>右クリック ->「パッケージの内容を表示」->「dSYMs」</li>
          <li>dSYM ファイルを zip 圧縮します</li>
        </ul>
        <p>
          Xcode の「Build Settings」->「Build Options」で dSYM 生成を有効化:
          <code>Debug Information Format = "DWARF with dSYM File"</code>
        </p>
        <p>または Xcode Organizer の「Download Debug Symbols」をお試しください</p>

        <h5>Android</h5>
        <p>
          Mapping ファイルを指します。
          <a href="https://developer.android.com/studio/build/shrink-code?hl=ja">ProGuard</a>
          で難読化されたスタックトレースを復元するために使用します。
        </p>
