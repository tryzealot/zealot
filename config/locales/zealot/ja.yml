  udid:
    title: UDID 取得
    index:
      apple_tip: iPhone または iPad で QR コードをスキャンしてインストールしてください
      macos_tip: macOS のチップ識別制限のため、iPhone/iPad でスキャンするかボタンを押して UDID を取得してください。
      nonapple_tip: :'udid.index.apple_tip'
      fetch_udid: 今すぐ UDID を取得
      app_open_in_safari: "「Safari で開く」を選択して取得"
      app_open_in_webbrower: 任意のブラウザで開いて取得
      help:
        title: UDID 取得に構成プロファイルのインストールが必要な理由
        body_html: |
          <p class="list-decimal px-5">
            UDID は Unique Device Identifier（一意のデバイス識別子）の略称です。Apple が iOS デバイスを識別するために提供する機能であり、Apple サーバーとデバイス間の通信、Apple ID や iCloud ID との紐付けに使用されます。すべての iOS デバイスが固有の ID を持ちます。
          </p>
          <p>
            App Store での公式公開前にアルファ版やベータ版の iOS アプリを実機にインストールする場合、お使いの端末の UDID の登録が必須となります。
          </p>
          <strong>取得手順:</strong>
          <ol>
            <li>「許可」をタップして構成プロファイルをダウンロードします。</li>
            <li>ダウンロードしたプロファイルを開きます。
              <ol>
                <li>iOS: 「設定」->「ダウンロード済みのプロファイル」->「デバイス UDID の取得」->「インストール」。</li>
                <li>macOS: <code>install.mobileconfig</code> を開き、「システム設定」-> サイドバーの「プロファイル」をクリックします。</li>
              </ol>
            </li>
            <li>インストール後、自動的に Safari が開き結果ページへ遷移し、プロファイルは即座に自動削除されます。</li>
          </ol>
